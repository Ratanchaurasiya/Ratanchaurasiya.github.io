<svg width="100%" height="100%" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="da_grad1" x1="12" y1="12" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8AE6CF"/>
      <stop offset="100%" stop-color="#7C3AE7"/>
    </linearGradient>
    <linearGradient id="da_grad2" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#66FECB"/>
      <stop offset="100%" stop-color="#8940FF"/>
    </linearGradient>
    <linearGradient id="da_grad_glow" x1="10" y1="10" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8A6FF"/>
      <stop offset="100%" stop-color="#69CFB5"/>
    </linearGradient>
    <filter id="da_blur" x="-8" y="-8" width="112" height="112" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Ambient glow background -->
  <ellipse cx="48" cy="48" rx="36" ry="36" fill="url(#da_grad1)" opacity="0.15" filter="url(#da_blur)"/>

  <!-- Outer Glass Frame / Board -->
  <rect x="10" y="12" width="76" height="72" rx="16" fill="#1D1D1D" fill-opacity="0.25" stroke="url(#da_grad_glow)" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="12" y="14" width="72" height="68" rx="14" fill="url(#da_grad1)" fill-opacity="0.06"/>

  <!-- Grid lines -->
  <line x1="18" y1="36" x2="78" y2="36" stroke="white" stroke-opacity="0.08" stroke-dasharray="3 3"/>
  <line x1="18" y1="52" x2="78" y2="52" stroke="white" stroke-opacity="0.08" stroke-dasharray="3 3"/>
  <line x1="18" y1="68" x2="78" y2="68" stroke="url(#da_grad_glow)" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Bar 1 -->
  <rect x="22" y="52" width="10" height="16" rx="4" fill="url(#da_grad1)" opacity="0.8"/>
  <rect x="22" y="52" width="10" height="16" rx="4" stroke="url(#da_grad_glow)" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Bar 2 -->
  <rect x="37" y="38" width="10" height="30" rx="4" fill="url(#da_grad2)" opacity="0.85"/>
  <rect x="37" y="38" width="10" height="30" rx="4" stroke="url(#da_grad_glow)" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Bar 3 -->
  <rect x="52" y="44" width="10" height="24" rx="4" fill="url(#da_grad1)" opacity="0.8"/>
  <rect x="52" y="44" width="10" height="24" rx="4" stroke="url(#da_grad_glow)" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Bar 4 (Peak) -->
  <rect x="67" y="24" width="10" height="44" rx="4" fill="url(#da_grad2)" opacity="0.95"/>
  <rect x="67" y="24" width="10" height="44" rx="4" stroke="url(#da_grad_glow)" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Trend Line Over Bars -->
  <path d="M27 48 L42 34 L57 40 L72 20" stroke="url(#da_grad_glow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Trend Data Points -->
  <circle cx="27" cy="48" r="3.5" fill="#8AE6CF" stroke="#1D1D1D" stroke-width="1"/>
  <circle cx="42" cy="34" r="3.5" fill="#66FECB" stroke="#1D1D1D" stroke-width="1"/>
  <circle cx="57" cy="40" r="3.5" fill="#C8A6FF" stroke="#1D1D1D" stroke-width="1"/>
  <circle cx="72" cy="20" r="4.5" fill="#8AE6CF" stroke="#7C3AE7" stroke-width="1.5"/>
  <circle cx="72" cy="20" r="1.5" fill="white"/>
</svg>
